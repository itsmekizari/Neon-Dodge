plugins {
    id 'com.android.application'
}

android {
    namespace 'com.train.neondodge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.train.neondodge'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
}
